name: 'ZeroGuard API Security Scan'
description: 'Scan API code for OWASP API Top 10 vulnerabilities'
inputs:
  path:
    description: 'Path to scan'
    required: false
    default: '.'
  format:
    description: 'Output format'
    required: false
    default: 'sarif'
  output:
    description: 'Output file path'
    required: false
    default: 'zeroguard-results.sarif'
  severity:
    description: 'Minimum severity'
    required: false
    default: 'low'
runs:
  using: 'composite'
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Install ZeroGuard CLI
      run: npm install -g @zeroguard/cli
      shell: bash
    - name: Run ZeroGuard scan
      run: zta scan ${{ inputs.path }} --format ${{ inputs.format }} --output ${{ inputs.output }} --severity ${{ inputs.severity }}
      shell: bash
    - name: Upload SARIF
      if: inputs.format == 'sarif'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.output }}
